<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="100" viewBox="0 0 1200 100"
     role="img" aria-labelledby="sec-usage-title sec-usage-desc">
  <title id="sec-usage-title">快速上手</title>
  <desc id="sec-usage-desc">JP Media Viewer 使用指南：三步开始浏览</desc>
  <defs>
    <linearGradient id="usage-line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58A6FF"/>
      <stop offset="100%" stop-color="#F78166"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="100" rx="16" fill="#0D1117"/>
  <rect x="56" y="0" width="2" height="100" fill="url(#usage-line)" opacity="0.3"/>
  <text x="76" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="28" font-weight="700" fill="#E6EDF3" letter-spacing="-0.5">
    快速上手
  </text>
  <text x="76" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif"
        font-size="13" fill="#8B949E">
    添加文件夹 → 等待扫描 → 开始浏览，三步即刻畅享本地媒体
  </text>
</svg>
