name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*", "beta*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jp-media-viewer-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |-
            APK 自动构建版本：${{ github.ref_name }}。此版本为 debug 签名，可直接安装用于测试。

            ### 变更内容
            - 收藏列表：首页新增“查看收藏”入口，可只浏览已收藏媒体
            - 收藏操作：双击图片或视频可收藏/取消收藏，收藏状态会持久保存
            - 手势浏览：新增下滑上一张，保留上滑下一张和单击显示/隐藏控制栏
            - 文件详情：长按媒体可查看文件详情，底部显示文件大小和所属文件夹
            - 扫描提示：优化扫描进度、空结果原因和文件夹授权失效提示
            - 项目文档：README 更新为当前功能说明，许可证改为 GPL v3 or later
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
