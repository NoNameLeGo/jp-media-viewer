name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*", "beta*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jp-media-viewer-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |-
            APK 自动构建版本：${{ github.ref_name }}。此版本为 debug 签名，可直接安装用于测试。

            ### 变更内容
            - 刷图动画：上划/下划切换改为 photoo 风格的卡片式飞出、带入和回弹动画
            - 浏览体验：拖动时当前媒体跟手移动、缩放、淡出，并显示下一张/上一张预览层
            - 图标更新：使用新版启动图标资源，补充圆形图标和 adaptive icon 前景引用
            - 版本元数据：应用版本更新为 beta0.0.4，延续 debug 签名测试包发布
            - 文档素材：新增图标提示词文档，便于后续维护启动图标风格
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
