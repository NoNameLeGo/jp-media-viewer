name: Build APK

on:
  push:
    branches: [main, develop]
    tags: ["v*", "beta*"]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./android

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: jp-media-viewer-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
        working-directory: ./android

      - name: Build installable debug APK
        run: ./gradlew assembleDebug --no-daemon
        working-directory: ./android

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |-
            APK 自动构建版本：${{ github.ref_name }}。此版本为 debug 签名，可直接安装用于测试。

            ### 变更内容
            - 自动扫描：添加文件夹后自动后台扫描，显示扫描进度和媒体数量，不再需要点击开始浏览等待扫描
            - 错误提示：文件夹授权失效或扫描异常时弹出提示
            - 应用图标：全新自适应矢量图标（深色背景 + 媒体卡片 + 取景框）
            - MIME 修复：扩展支持更多图片/视频格式
            - 视频播放：切换视频时正确释放前一个播放器
            - 播放器安全：切换视频时正确销毁前一个 ExoPlayer，避免内存泄漏
            - 稳定扫描：修复递归扫描计数，增加格式兼容性，.nomedia 过滤开关优化
            - Material You：低版本 Android 兼容性处理，不崩溃
          files: android/app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: false
